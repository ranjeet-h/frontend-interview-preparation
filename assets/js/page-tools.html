<!-- Inject global page tools into the sidebar toolbar (next to the theme
     toggle): "Copy page text" and "Print / Save as PDF". The EPUB download
     button is added natively by `book: downloads` in _quarto.yml.
     Included via `format: html: include-after-body`. -->
<script type="speculationrules">
  {
    "prefetch": [
      {
        "source": "document",
        "where": { "href_matches": "/*" },
        "eagerness": "moderate"
      }
    ]
  }
</script>
<script>
  (function () {
    "use strict";

    var COPY_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1.05em" height="1.05em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>';
    var CHECK_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1.05em" height="1.05em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>';
    var PRINT_SVG =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1.05em" height="1.05em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"></path><rect x="4" y="9" width="16" height="8" rx="2"></rect><path d="M8 17h8v4H8z"></path></svg>';

    function getPageText() {
      var main =
        document.querySelector("main#quarto-document-content") ||
        document.querySelector("main") ||
        document.querySelector("#quarto-document-content");
      if (!main) return "";
      var clone = main.cloneNode(true);
      clone
        .querySelectorAll("script, style, .code-copy-button, .anchor, .quarto-title-block")
        .forEach(function (el) {
          el.remove();
        });
      return (clone.innerText || clone.textContent || "").trim();
    }

    function copyWithExecCommand(text) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "0";
      ta.style.left = "0";
      ta.style.width = "1px";
      ta.style.height = "1px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      var ok = false;
      try {
        ok = document.execCommand("copy");
      } finally {
        document.body.removeChild(ta);
      }
      if (!ok) throw new Error("execCommand copy failed");
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(function () {
          copyWithExecCommand(text);
        });
      }
      copyWithExecCommand(text);
      return Promise.resolve();
    }

    function makeTool(id, label, svg) {
      var a = document.createElement("a");
      a.href = "#";
      a.id = id;
      a.className = "quarto-navigation-tool px-1";
      a.setAttribute("role", "button");
      a.setAttribute("title", label);
      a.setAttribute("aria-label", label);
      a.innerHTML = svg;
      return a;
    }

    function mount() {
      var tools = document.querySelector(".sidebar-tools-main");
      if (!tools) return;

      if (!document.getElementById("copy-page-button")) {
        var copy = makeTool("copy-page-button", "Copy page text", COPY_SVG);
        copy.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          var text = getPageText();
          if (!text) return;
          var previous = copy.getAttribute("title");
          Promise.resolve(copyText(text)).then(function () {
            copy.classList.add("copied");
            copy.setAttribute("title", "Copied!");
            copy.setAttribute("aria-label", "Copied!");
            copy.innerHTML = CHECK_SVG;
            window.setTimeout(function () {
              copy.classList.remove("copied");
              copy.setAttribute("title", previous);
              copy.setAttribute("aria-label", previous);
              copy.innerHTML = COPY_SVG;
            }, 1500);
          });
        });
        tools.insertBefore(copy, tools.firstChild);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", mount);
    } else {
      mount();
    }
  })();
</script>
